name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm install --global npm@11.19.0

      - run: npm install

      - run: npm run build

      - run: node scripts/verify-browser-bundle.mjs

      - run: npm test

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --global npm@11.19.0

      - run: npm install

      - run: npm run test:coverage --workspace core

      - run: npm run test:coverage --workspace cli

      - run: npm run test:coverage --workspace figma-plugin

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./core/coverage/lcov.info,./cli/coverage/lcov.info,./figma-plugin/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  swift-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: swift-actions/setup-swift@v3
        with:
          # setup-swift@v2 fails when the external GPG keyserver is unavailable.
          # Swift compilation below remains the required verification step.
          skip-verify-signature: true
          swift-version: "6.0"

      - run: npm install --global npm@11.19.0

      - run: npm install

      - run: npm run build

      - run: npm run verify:swift

  android-resources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;34.0.0"

      - run: npm install --global npm@11.19.0

      - run: npm install

      - run: npm run build

      # Fails the job when aapt2 is missing, so that a broken toolchain setup
      # cannot turn the check into a silent skip.
      - run: test -x "$ANDROID_HOME/build-tools/34.0.0/aapt2"

      - run: npm run verify:android

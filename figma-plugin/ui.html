<!doctype html>
<html>
<style>
    body {
        font-family: Inter, sans-serif;
        padding: 16px;
    }

    label,
    input,
    button {
        display: block;
    }

    input,
    button {
        margin-top: 8px;
        margin-bottom: 12px;
        width: 100%;
        box-sizing: border-box;
    }

    pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        max-height: 260px;
        overflow: auto;
        background: #f5f5f5;
        padding: 12px;
        border-radius: 8px;
    }
</style>
<body>
<h2>Figma Core Export</h2>

<label for="figma-token">Figma REST Token</label>
<input id="figma-token" type="password" placeholder="figd_...">

<button id="download-rest-json">
    Download REST JSON
</button>

<button id="download-plugin-json">
    Download Plugin JSON
</button>

<p id="status">Ready.</p>
<p id="dto-summary"></p>

<h3>Last JSON</h3>
<pre id="json-preview"></pre>

<script>
    const figmaTokenInput = document.getElementById("figma-token");
    const downloadRestJsonButton = document.getElementById("download-rest-json");
    const downloadPluginJsonButton = document.getElementById("download-plugin-json");
    const status = document.getElementById("status");
    const dtoSummary = document.getElementById("dto-summary");
    const jsonPreview = document.getElementById("json-preview");

    downloadRestJsonButton.addEventListener("click", () => {
        status.textContent = "Exporting REST JSON...";

        parent.postMessage(
            {
                pluginMessage: {
                    type: "EXPORT_REST_JSON",
                    accessToken: figmaTokenInput.value,
                },
            },
            "*",
        );
    });

    downloadPluginJsonButton.addEventListener("click", () => {
        status.textContent = "Exporting Plugin JSON...";

        parent.postMessage(
            {
                pluginMessage: {
                    type: "EXPORT_PLUGIN_JSON",
                },
            },
            "*",
        );
    });

    window.onmessage = (event) => {
        const message = event.data.pluginMessage;

        if (message?.type === "EXPORT_FAILED") {
            status.textContent = `Failed to export ${message.payload.source} JSON: ${message.payload.message}`;
            return;
        }

        if (message?.type !== "FILE_EXPORTED") {
            return;
        }

        downloadJsonFile(message.payload.fileName, message.payload.content);
        jsonPreview.textContent = message.payload.content;
        dtoSummary.textContent = createDtoSummary(message.payload.dto);
        status.textContent = `Downloaded ${message.payload.fileName}.`;
    };

    function createDtoSummary(dto) {
        return [
            `DTO name: ${dto.name}`,
            `pages: ${dto.pages.length}`,
            `components: ${dto.componentIds.length}`,
            `component sets: ${dto.componentSetIds.length}`,
            `styles: ${dto.styleIds.length}`,
        ].join(". ");
    }

    function downloadJsonFile(fileName, text) {
        const blob = new Blob([text], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = fileName;
        link.click();
        URL.revokeObjectURL(url);
    }
</script>

</body>
</html>

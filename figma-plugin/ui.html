<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <style>
        :root {
            color: #172033;
            background: #f5f7fb;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            margin: 0;
            padding: 16px;
        }

        h1,
        h2,
        h3,
        p {
            margin: 0;
        }

        button,
        input {
            box-sizing: border-box;
            width: 100%;
            font: inherit;
        }

        button {
            cursor: pointer;
            border: 1px solid #cad3e3;
            border-radius: 10px;
            padding: 10px 12px;
            color: #172033;
            background: #fff;
        }

        button.primary {
            border-color: #255ad6;
            color: #fff;
            background: #255ad6;
            font-weight: 700;
        }

        input {
            border: 1px solid #cad3e3;
            border-radius: 8px;
            padding: 8px 10px;
            color: #172033;
            background: #fff;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #58647a;
            font-size: 12px;
            font-weight: 700;
        }

        .app {
            display: grid;
            gap: 14px;
        }

        .panel {
            border: 1px solid #dde4f0;
            border-radius: 14px;
            padding: 14px;
            background: #fff;
            box-shadow: 0 8px 24px rgba(23, 32, 51, 0.06);
        }

        .hero {
            display: grid;
            gap: 12px;
        }

        .eyebrow {
            color: #6f7b91;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .title {
            font-size: 20px;
            line-height: 1.2;
        }

        .description {
            color: #58647a;
            font-size: 13px;
            line-height: 1.45;
        }

        .status {
            border-radius: 10px;
            padding: 10px 12px;
            color: #2d3a52;
            background: #edf3ff;
            font-size: 13px;
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }

        .metric {
            border: 1px solid #e1e7f2;
            border-radius: 10px;
            padding: 9px;
            background: #fafcff;
        }

        .metric-value {
            display: block;
            font-size: 18px;
            font-weight: 800;
        }

        .metric-label {
            display: block;
            margin-top: 2px;
            color: #6f7b91;
            font-size: 11px;
        }

        .warnings {
            display: none;
        }

        .warnings.visible {
            display: block;
        }

        .warnings-list {
            margin: 10px 0 0;
            padding-left: 18px;
            color: #8a4b00;
            font-size: 12px;
            line-height: 1.4;
        }

        .details {
            display: grid;
            gap: 10px;
        }

        .diagnostic-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .platform-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .help-text {
            color: #6f7b91;
            font-size: 12px;
            line-height: 1.4;
        }

        .hidden {
            display: none;
        }

        summary {
            cursor: pointer;
            color: #3c4a62;
            font-weight: 800;
        }
    </style>
</head>
<body>
<main class="app">
    <section class="panel hero">
        <p class="eyebrow">Design Token Kit</p>
        <h1 class="title">Export Figma tokens</h1>
        <p class="description">Downloads DTCG tokens and converts them through Design Token Kit core converters.</p>
        <div class="platform-actions">
            <button class="primary" data-token-export-message="EXPORT_TOKENS_DTCG">DTCG JSON</button>
            <button data-token-export-message="EXPORT_TOKENS_CSS">CSS</button>
            <button data-token-export-message="EXPORT_TOKENS_SCSS">SCSS</button>
            <button data-token-export-message="EXPORT_TOKENS_TAILWIND">Tailwind v4</button>
            <button data-token-export-message="EXPORT_TOKENS_SWIFTUI">SwiftUI</button>
        </div>
        <p id="status" class="status">Ready.</p>
    </section>

    <section class="panel">
        <h2 class="eyebrow">Summary</h2>
        <div id="token-summary" class="metrics" aria-live="polite"></div>
    </section>

    <section id="warnings-panel" class="panel warnings">
        <h2 class="eyebrow">Warnings</h2>
        <ul id="warnings-list" class="warnings-list"></ul>
    </section>

    <details class="panel details hidden">
        <summary>Diagnostic exports</summary>
        <p class="help-text">Raw JSON exports are for debugging differences between Figma Plugin API and REST API. They are not token files.</p>
        <label for="figma-token">Figma REST Token</label>
        <input id="figma-token" type="password" placeholder="figd_...">
        <div class="diagnostic-actions">
            <button id="download-rest-json">Debug: REST JSON</button>
            <button id="download-plugin-json">Debug: Plugin JSON</button>
        </div>
    </details>

</main>

<script>
    const figmaTokenInput = document.getElementById("figma-token");
    const tokenExportButtons = document.querySelectorAll("[data-token-export-message]");
    const downloadRestJsonButton = document.getElementById("download-rest-json");
    const downloadPluginJsonButton = document.getElementById("download-plugin-json");
    const status = document.getElementById("status");
    const tokenSummary = document.getElementById("token-summary");
    const warningsPanel = document.getElementById("warnings-panel");
    const warningsList = document.getElementById("warnings-list");

    renderMetrics({
        colorTokens: 0,
        dimensionTokens: 0,
        numberTokens: 0,
        typographyTokens: 0,
        shadowTokens: 0,
        skipped: 0,
    });

    tokenExportButtons.forEach((button) => {
        button.addEventListener("click", () => {
            status.textContent = `Exporting ${button.textContent}...`;
            clearWarnings();

            parent.postMessage(
                {
                    pluginMessage: {
                        type: button.dataset.tokenExportMessage,
                    },
                },
                "*",
            );
        });
    });

    downloadRestJsonButton.addEventListener("click", () => {
        status.textContent = "Exporting REST JSON...";

        parent.postMessage(
            {
                pluginMessage: {
                    type: "EXPORT_REST_JSON",
                    accessToken: figmaTokenInput.value,
                },
            },
            "*",
        );
    });

    downloadPluginJsonButton.addEventListener("click", () => {
        status.textContent = "Exporting Plugin JSON...";

        parent.postMessage(
            {
                pluginMessage: {
                    type: "EXPORT_PLUGIN_JSON",
                },
            },
            "*",
        );
    });

    window.onmessage = (event) => {
        const message = event.data.pluginMessage;

        if (message?.type === "EXPORT_FAILED") {
            status.textContent = `Failed to export ${message.payload.source} JSON: ${message.payload.message}`;
            renderWarnings([message.payload.message]);
            return;
        }

        if (message?.type === "TOKENS_EXPORTED") {
            handleTokensExported(message.payload);
            return;
        }

        if (message?.type !== "FILE_EXPORTED") {
            return;
        }

        downloadTextFile(message.payload.fileName, message.payload.content);
        renderDiagnosticSummary(message.payload.dto);
        clearWarnings();
        status.textContent = `Downloaded ${message.payload.fileName}.`;
    };

    function handleTokensExported(payload) {
        const files = payload.files;
        const downloadableFiles = files.filter((exportedFile) => exportedFile.downloadable !== false);

        downloadableFiles.forEach((exportedFile) => downloadTextFile(exportedFile.fileName, exportedFile.content));
        renderMetrics(payload.summary);
        renderWarnings(payload.warnings);
        status.textContent = downloadableFiles.length > 0
            ? `Downloaded ${downloadableFiles.map((exportedFile) => exportedFile.fileName).join(", ")}.`
            : "No token files to download.";
    }

    function renderMetrics(summary) {
        tokenSummary.innerHTML = "";
        [
            ["Colors", summary.colorTokens],
            ["Dimensions", summary.dimensionTokens],
            ["Numbers", summary.numberTokens],
            ["Typography", summary.typographyTokens],
            ["Shadows", summary.shadowTokens],
            ["Skipped", summary.skipped],
        ].forEach(([label, value]) => {
            tokenSummary.appendChild(createMetric(label, value));
        });
    }

    function renderDiagnosticSummary(dto) {
        tokenSummary.innerHTML = "";
        [
            ["Pages", dto.pages.length],
            ["Components", dto.componentIds.length],
            ["Sets", dto.componentSetIds.length],
            ["Styles", dto.styleIds.length],
            ["Source", dto.name],
        ].forEach(([label, value]) => {
            tokenSummary.appendChild(createMetric(label, value));
        });
    }

    function createMetric(label, value) {
        const item = document.createElement("div");
        const valueElement = document.createElement("span");
        const labelElement = document.createElement("span");

        item.className = "metric";
        valueElement.className = "metric-value";
        valueElement.textContent = String(value);
        labelElement.className = "metric-label";
        labelElement.textContent = label;

        item.appendChild(valueElement);
        item.appendChild(labelElement);

        return item;
    }

    function renderWarnings(warnings) {
        warningsList.innerHTML = "";
        warningsPanel.classList.toggle("visible", warnings.length > 0);

        warnings.forEach((warning) => {
            const item = document.createElement("li");
            item.textContent = warning;
            warningsList.appendChild(item);
        });
    }

    function clearWarnings() {
        renderWarnings([]);
    }

    function downloadTextFile(fileName, text) {
        const blob = new Blob([text], { type: toMimeType(fileName) });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = fileName;
        link.click();
        URL.revokeObjectURL(url);
    }

    function toMimeType(fileName) {
        if (fileName.endsWith(".json")) {
            return "application/json";
        }

        if (fileName.endsWith(".css") || fileName.endsWith(".scss")) {
            return "text/css";
        }

        return "text/plain";
    }

</script>
</body>
</html>
